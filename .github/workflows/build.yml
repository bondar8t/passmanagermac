name: Build Mac App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Если вашему коду нужны другие библиотеки (например, requests), раскомментируйте строку ниже и укажите их:
        # pip install requests

    - name: Build with PyInstaller
      run: |
        # ВАЖНО: Замените script.py на точное имя вашего файла, если оно другое!
        pyinstaller --onedir script.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mac-console-app
        path: dist/
